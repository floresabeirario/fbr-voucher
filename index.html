<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vale Presente · Flores à Beira-Rio</title>
<meta name="description" content="O teu vale presente Flores à Beira-Rio — preservação botânica artesanal.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:      #3D6B5E;
  --green-dark: #0F1E1A;
  --green-mid:  #2a4f45;
  --cream:      #FAF7F0;
  --cream-dark: #f0ead8;
  --terracotta: #C4846B;
  --gold:       #B8954A;
  --gold-light: #d4b06e;

  /* Card / envelope dimensions — updated dynamically once PDF is known */
  --panel-w: 200px;   /* width of each gatefold half-panel */
  --card-h:  280px;   /* card height */
  --env-w:   480px;
  --env-h:   336px;
}

html, body { width: 100%; height: 100%; overflow-x: hidden; }

body {
  font-family: 'Jost', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(ellipse 120% 80% at 20% 0%,  rgba(61,107,94,.07)  0%, transparent 60%),
    radial-gradient(ellipse 80%  60% at 80% 100%, rgba(184,149,74,.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.scene {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 2.5rem;
  width: 100%;
}

/* ── Brand ─────────────────────────────── */
.brand {
  text-align: center;
  opacity: 0;
  animation: fadeUp .8s .2s ease forwards;
}
.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-weight: 400;
  letter-spacing: .25em; color: var(--green);
  text-transform: uppercase;
}
.brand-tagline {
  font-size: .72rem; letter-spacing: .15em;
  color: var(--terracotta); text-transform: uppercase;
  margin-top: .25rem; font-weight: 300;
}

/* ── Envelope scene ─────────────────────── */
.envelope-scene {
  position: relative;
  width: var(--env-w); height: var(--env-h);
  opacity: 0;
  animation: fadeUp .8s .5s ease forwards;
}

.envelope-shadow {
  position: absolute; bottom: -18px; left: 50%;
  transform: translateX(-50%);
  width: 380px; height: 24px;
  background: radial-gradient(ellipse, rgba(15,30,26,.2) 0%, transparent 70%);
  border-radius: 50%;
  transition: all .6s ease;
}
.envelope-shadow.open { width: 320px; opacity: .6; }

.envelope {
  position: absolute; inset: 0;
  cursor: pointer; perspective: 1200px;
}

.env-body {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #f5ede0 0%, #ede2ce 100%);
  border-radius: 4px 4px 8px 8px;
  box-shadow:
    0 8px 32px rgba(15,30,26,.12),
    0 2px 8px  rgba(15,30,26,.08),
    inset 0 1px 0 rgba(255,255,255,.5);
  overflow: hidden;
}
.env-body::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient( 45deg, rgba(61,107,94,.04) 0px, rgba(61,107,94,.04) 1px, transparent 1px, transparent 12px),
    repeating-linear-gradient(-45deg, rgba(61,107,94,.04) 0px, rgba(61,107,94,.04) 1px, transparent 1px, transparent 12px);
}

.env-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
  overflow: hidden;
}
.env-bottom::before {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 200%;
  background: linear-gradient(180deg, #d8c9ae 0%, #cdbfa8 100%);
  clip-path: polygon(0 100%, 50% 0%, 100% 100%);
}

.env-sides { position: absolute; inset: 0; overflow: hidden; }
.env-sides::before, .env-sides::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 55%;
}
.env-sides::before {
  left: 0;
  clip-path: polygon(0 0, 0 100%, 100% 50%);
  background: linear-gradient(90deg, #d8c9ae, #e8d8c0);
}
.env-sides::after {
  right: 0;
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
  background: linear-gradient(-90deg, #d8c9ae, #e8d8c0);
}

.env-flap {
  position: absolute; top: 0; left: 0; right: 0; height: 55%;
  transform-origin: top center;
  transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.4,0,.2,1);
  z-index: 10;
}
.env-flap-face {
  position: absolute; inset: 0;
  overflow: hidden; border-radius: 4px 4px 0 0;
}
.env-flap-face::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, #f5ede0 0%, #e8d5bb 100%);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.env-flap-face::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(61,107,94,.2), transparent);
}

.env-seal {
  position: absolute; bottom: 30px; left: 50%;
  transform: translateX(-50%);
  width: 44px; height: 44px; z-index: 5;
  transition: transform .4s ease, opacity .4s ease;
}
.env-seal svg { width: 100%; height: 100%; }

.envelope.open .env-flap    { transform: rotateX(-180deg); }
.envelope.open .env-seal    { opacity: 0; transform: translateX(-50%) scale(.8); }

.click-hint {
  position: absolute; bottom: -48px; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: .72rem; letter-spacing: .15em; text-transform: uppercase;
  color: var(--green); opacity: .6;
  display: flex; align-items: center; gap: 8px;
  transition: opacity .4s; font-weight: 300;
}
.click-hint::before, .click-hint::after {
  content: ''; display: block; width: 20px; height: 1px;
  background: var(--green); opacity: .4;
}

/* ── Card wrapper ──────────────────────────
   Starts absolutely centred inside envelope-scene,
   then rises and moves into page flow.           */
.card-wrapper {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 4;
  transition: top .8s cubic-bezier(.4,0,.2,1), opacity .6s ease;
  opacity: 0; pointer-events: none;
}
.card-wrapper.rising {
  top: calc(-1 * var(--card-h) * 0.35);
  opacity: 1; pointer-events: auto;
}
.card-wrapper.risen {
  position: relative; top: auto; left: auto;
  transform: none; opacity: 1; pointer-events: auto;
  margin: 0 auto;
}

/* ── 3-D card shell ────────────────────── */
.card-perspective { perspective: 1400px; }

/* This element gets the tilt transform from JS */
.card-tilt {
  position: relative;
  transform-style: preserve-3d;
  transform: rotateY(-8deg) rotateX(4deg);
  will-change: transform;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.card-tilt:active { cursor: grabbing; }

/* Realistic drop shadow pushed back in Z */
.card-shadow {
  position: absolute; inset: 4px;
  border-radius: 12px;
  transform: translateZ(-8px);
  box-shadow:
    0 28px 90px rgba(15,30,26,.4),
    0  8px 24px rgba(15,30,26,.22);
  pointer-events: none;
}

/* ── Gatefold structure ─────────────────── */
.gatefold {
  position: relative;
  display: flex;
  width:  calc(var(--panel-w) * 2);
  height: var(--card-h);
  border-radius: 12px;
  transform-style: preserve-3d; /* needed so children share the card-tilt 3D context */
}

/* Inside reveal (page 2) — absolute, fills gatefold */
.gatefold-inside {
  position: absolute; inset: 0;
  border-radius: 12px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0;
  transform: translateZ(1px);   /* always in front of panel faces in Z */
  pointer-events: none;
  transition: opacity .35s ease;
}
.gatefold-inside.visible { opacity: 1; pointer-events: auto; }

/* Panels container */
.gatefold-panels {
  position: absolute; inset: 0;
  display: flex;
  transform-style: preserve-3d;
}

/* Individual panel */
.panel {
  flex: 1;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 1.1s cubic-bezier(.4,0,.2,1);
}
.panel-left  { transform-origin: right  center; border-radius: 12px 0 0 12px; }
.panel-right { transform-origin: left   center; border-radius: 0 12px 12px 0; }

/* Panel faces */
.panel-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: inherit;
}

/* Front face: shows halves of page 1 */
.panel-face-front {
  background-size: 200% 100%;
  background-repeat: no-repeat;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 1px 0 rgba(255,255,255,.12);
}
.panel-left  .panel-face-front { background-position:   0% 50%; }
.panel-right .panel-face-front { background-position: 100% 50%; }

/* Back face: the reverse side of each panel (shows when panel folds back) */
.panel-face-back {
  transform: rotateY(180deg);
  background: linear-gradient(160deg, #f7f0e6 0%, #ede5d5 100%);
  box-shadow: inset 0 0 0 1px rgba(61,107,94,.06);
}

/* Loading placeholder (green card while PDF renders) */
.gatefold-loading {
  position: absolute; inset: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 40%, var(--green) 100%);
  display: flex; align-items: center; justify-content: center; gap: 12px;
  color: rgba(250,247,240,.55);
  font-family: 'Cormorant Garamond', serif;
  font-size: .85rem; letter-spacing: .2em; text-transform: uppercase;
  z-index: 20;
  transition: opacity .4s ease;
}
.gatefold-loading.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 1px solid rgba(184,149,74,.25);
  border-top-color: rgba(184,149,74,.8);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Spine — subtle crease at centre fold line */
.gatefold-spine {
  position: absolute; top: 4px; bottom: 4px;
  left: 50%; width: 1px;
  margin-left: -0.5px;
  background: linear-gradient(180deg,
    transparent,
    rgba(0,0,0,.18) 15%,
    rgba(0,0,0,.18) 85%,
    transparent);
  transform: translateZ(2px);
  pointer-events: none;
  transition: opacity .5s ease;
  z-index: 5;
}

/* Open state */
.gatefold.open .panel-left   { transform: rotateY( 180deg); }
.gatefold.open .panel-right  { transform: rotateY(-180deg); }
.gatefold.open .gatefold-spine { opacity: 0; }

/* ── Hint texts ─────────────────────────── */
.interact-hint {
  font-size: .68rem; letter-spacing: .15em; text-transform: uppercase;
  color: var(--green); font-weight: 300;
  display: flex; align-items: center; gap: 8px;
  opacity: 0; transition: opacity .6s ease;
  text-align: center;
}
.interact-hint.visible { opacity: .5; }
.interact-hint::before, .interact-hint::after {
  content: ''; display: block; width: 20px; height: 1px;
  background: var(--green); opacity: .4;
}

/* ── CTA ────────────────────────────────── */
.cta-area {
  display: flex; flex-direction: column; align-items: center; gap: 1rem;
  opacity: 0; transition: opacity .6s ease;
}
.cta-area.visible { opacity: 1; }

.cta-message {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; font-weight: 300; font-style: italic;
  color: var(--green); text-align: center; letter-spacing: .03em;
}
.cta-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 28px;
  background: transparent;
  border: 1px solid rgba(61,107,94,.35); border-radius: 2px;
  font-family: 'Jost', sans-serif;
  font-size: .68rem; letter-spacing: .22em; text-transform: uppercase;
  color: var(--green); text-decoration: none; font-weight: 400;
  cursor: pointer;
  transition: background .3s, border-color .3s, color .3s;
}
.cta-btn:hover { background: var(--green); color: var(--cream); border-color: var(--green); }

/* ── Footer ─────────────────────────────── */
.footer {
  margin-top: 1.5rem; text-align: center;
  opacity: 0; animation: fadeUp .8s .8s ease forwards;
}
.footer-text {
  font-size: .62rem; letter-spacing: .12em;
  color: rgba(61,107,94,.4); text-transform: uppercase; font-weight: 300;
}

/* ── Keyframes ──────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Mobile ─────────────────────────────── */
@media (max-width: 520px) {
  :root {
    --panel-w: 155px;
    --card-h:  220px;
    --env-w:   360px;
    --env-h:   268px;
  }
}
@media (max-width: 380px) {
  :root {
    --panel-w: 135px;
    --card-h:  190px;
    --env-w:   310px;
    --env-h:   232px;
  }
}
</style>
</head>
<body>

<div class="scene">

  <!-- Brand header -->
  <div class="brand">
    <div class="brand-name">Flores à Beira-Rio</div>
    <div class="brand-tagline">Vale Presente · Preservação Botânica</div>
  </div>

  <!-- Envelope scene (card lives inside while waiting) -->
  <div class="envelope-scene" id="envelopeScene">

    <div class="envelope-shadow" id="envShadow"></div>

    <!-- Card (starts hidden inside envelope) -->
    <div class="card-wrapper" id="cardWrapper">
      <div class="card-perspective">
        <div class="card-tilt" id="cardTilt">

          <!-- Shadow plane pushed back in Z -->
          <div class="card-shadow"></div>

          <!-- Gatefold -->
          <div class="gatefold" id="gatefold">

            <!-- Loading state while PDF renders -->
            <div class="gatefold-loading" id="gatefoldLoading">
              <div class="loading-spinner"></div>
              a carregar
            </div>

            <!-- Inside (page 2) — shown when gatefold opens -->
            <div class="gatefold-inside" id="gatefoldInside"></div>

            <!-- Fold line decoration -->
            <div class="gatefold-spine" id="gatefoldSpine"></div>

            <!-- Two front panels -->
            <div class="gatefold-panels">
              <div class="panel panel-left" id="panelLeft">
                <div class="panel-face panel-face-front" id="frontLeft"></div>
                <div class="panel-face panel-face-back"></div>
              </div>
              <div class="panel panel-right" id="panelRight">
                <div class="panel-face panel-face-front" id="frontRight"></div>
                <div class="panel-face panel-face-back"></div>
              </div>
            </div>

          </div><!-- /gatefold -->

        </div><!-- /card-tilt -->
      </div><!-- /card-perspective -->
    </div><!-- /card-wrapper -->

    <!-- Envelope body -->
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="env-body">
        <div class="env-sides"></div>
        <div class="env-bottom"></div>
      </div>
      <div class="env-flap">
        <div class="env-flap-face"></div>
      </div>
      <div class="env-seal">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="22" cy="22" r="21"
            fill="#3D6B5E" fill-opacity=".12"
            stroke="#3D6B5E" stroke-width=".8" stroke-opacity=".4"/>
          <circle cx="22" cy="22" r="16"
            stroke="#B8954A" stroke-width=".6" stroke-opacity=".5"/>
          <g stroke="#3D6B5E" stroke-width=".8" stroke-opacity=".7" fill="none">
            <ellipse cx="22" cy="22" rx="4" ry="7"/>
            <ellipse cx="22" cy="22" rx="4" ry="7" transform="rotate(60 22 22)"/>
            <ellipse cx="22" cy="22" rx="4" ry="7" transform="rotate(120 22 22)"/>
          </g>
          <circle cx="22" cy="22" r="2.5" fill="#B8954A" fill-opacity=".5"/>
        </svg>
      </div>
    </div>

    <div class="click-hint" id="clickHint">clica para abrir</div>

  </div><!-- /envelope-scene -->

  <!-- Shown after card rises -->
  <div class="interact-hint" id="interactHint">clica no cartão para o abrir</div>

  <!-- CTA -->
  <div class="cta-area" id="ctaArea">
    <div class="cta-message" id="ctaMessage">Uma recordação para toda a vida.</div>
    <a href="https://floresabeirario.pt/como-funciona" class="cta-btn"
       target="_blank" rel="noopener">Como funciona →</a>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">© Flores à Beira-Rio · Ceira, Coimbra</div>
  </div>

</div><!-- /scene -->

<!-- PDF.js (non-module, wide browser support) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* ════════════════════════════════════════════
   0. URL params (future: Google Sheets link)
   ════════════════════════════════════════════ */
(function () {
  const p = new URLSearchParams(window.location.search);
  if (p.get('mensagem')) document.getElementById('ctaMessage').textContent = p.get('mensagem');
})();

/* ════════════════════════════════════════════
   1. PDF rendering
   ════════════════════════════════════════════ */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let frontDataUrl = null;
let backDataUrl  = null;

async function pageToDataURL(page, targetPx) {
  const baseVP = page.getViewport({ scale: 1 });
  const scale  = Math.min(targetPx / baseVP.width, 3.0);
  const vp     = page.getViewport({ scale });

  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(vp.width);
  canvas.height = Math.round(vp.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas.toDataURL('image/jpeg', 0.92);
}

async function loadPDF() {
  try {
    const pdf  = await pdfjsLib.getDocument('voucher_azul.pdf').promise;
    const page1 = await pdf.getPage(1);

    /* Render at a generous resolution so it looks sharp */
    const targetPx = Math.min(window.innerWidth * 1.6, 1400);
    frontDataUrl = await pageToDataURL(page1, targetPx);

    if (pdf.numPages >= 2) {
      const page2 = await pdf.getPage(2);
      backDataUrl = await pageToDataURL(page2, targetPx);
    } else {
      backDataUrl = frontDataUrl; // fallback
    }

    applyToCard(page1);

  } catch (err) {
    console.warn('PDF load error:', err);
    showFallback();
  }
}

function applyToCard(page1) {
  /* Compute card dimensions from PDF page aspect ratio */
  const vp          = page1.getViewport({ scale: 1 });
  const pdfAspect   = vp.width / vp.height; // full open card W/H

  /* Max card width that fits the viewport comfortably */
  const maxCardW = Math.min(window.innerWidth - 48, 680);
  const cardW    = maxCardW;
  const cardH    = Math.round(cardW / pdfAspect);
  const panelW   = Math.round(cardW / 2);

  /* Envelope slightly larger than card */
  const envW = Math.min(cardW + 90, window.innerWidth - 16);
  const envH = Math.round(cardH * 1.22);

  const r = document.documentElement.style;
  r.setProperty('--panel-w', panelW + 'px');
  r.setProperty('--card-h',  cardH  + 'px');
  r.setProperty('--env-w',   envW   + 'px');
  r.setProperty('--env-h',   envH   + 'px');

  /* Apply front image (split across two panel faces) */
  document.getElementById('frontLeft').style.backgroundImage  = `url('${frontDataUrl}')`;
  document.getElementById('frontRight').style.backgroundImage = `url('${frontDataUrl}')`;

  /* Apply back/inside image */
  document.getElementById('gatefoldInside').style.backgroundImage = `url('${backDataUrl}')`;

  /* Hide loading overlay */
  const loading = document.getElementById('gatefoldLoading');
  loading.classList.add('hidden');
  setTimeout(() => { loading.style.display = 'none'; }, 500);
}

function showFallback() {
  const loading = document.getElementById('gatefoldLoading');
  loading.innerHTML = `
    <div style="text-align:center;padding:1.5rem">
      <div style="font-family:'Cormorant Garamond',serif;color:rgba(250,247,240,.8);
                  font-size:1.4rem;letter-spacing:.15em">Vale Presente</div>
      <div style="color:rgba(184,149,74,.7);font-size:.75rem;
                  letter-spacing:.18em;margin-top:.4rem">Flores à Beira-Rio</div>
    </div>`;
  loading.classList.remove('hidden');
}

/* Start loading immediately */
loadPDF();

/* ════════════════════════════════════════════
   2. Envelope → card rise → gatefold
   ════════════════════════════════════════════ */
let envelopeOpened = false;

function openEnvelope() {
  if (envelopeOpened) return;
  envelopeOpened = true;

  const envelope  = document.getElementById('envelope');
  const shadow    = document.getElementById('envShadow');
  const clickHint = document.getElementById('clickHint');

  envelope.classList.add('open');
  shadow.classList.add('open');
  clickHint.style.opacity = '0';
  envelope.style.cursor = 'default';
  envelope.onclick = null;

  setTimeout(riseCard, 480);
}

function riseCard() {
  const wrapper = document.getElementById('cardWrapper');
  wrapper.style.transition = 'top .95s cubic-bezier(.22,1,.36,1), opacity .55s ease';
  wrapper.classList.add('rising');
  setTimeout(settleCard, 1150);
}

function settleCard() {
  const wrapper = document.getElementById('cardWrapper');
  const scene   = document.getElementById('envelopeScene');

  wrapper.style.transition = 'none';
  wrapper.classList.remove('rising');
  wrapper.classList.add('risen');

  /* Pull the card out of the envelope-scene into normal flow */
  scene.parentNode.insertBefore(wrapper, scene.nextSibling);
  scene.style.height = 'var(--env-h)';

  /* Show hints and CTA */
  setTimeout(() => {
    document.getElementById('interactHint').classList.add('visible');
    document.getElementById('ctaArea').classList.add('visible');
  }, 350);

  initCardInteraction();
}

/* ════════════════════════════════════════════
   3. Card interaction: tilt + gatefold open
   ════════════════════════════════════════════ */
function initCardInteraction() {
  const tilt     = document.getElementById('cardTilt');
  const gatefold = document.getElementById('gatefold');
  const wrapper  = document.getElementById('cardWrapper');
  const hint     = document.getElementById('interactHint');

  /* Rotation state */
  let ry = -8, rx = 4;   /* current (lerped) */
  let ty = -8, tx = 4;   /* target            */

  let gatefoldOpen  = false;
  let isDragging    = false;
  let dragMoved     = false;
  let startX = 0, startY = 0;
  let pointerDownTime = 0;

  /* Smooth lerp loop */
  function tick() {
    ry += (ty - ry) * 0.09;
    rx += (tx - rx) * 0.09;
    tilt.style.transform = `rotateY(${ry}deg) rotateX(${rx}deg)`;
    requestAnimationFrame(tick);
  }
  tick();

  /* Resting angles */
  function restAngles() {
    ty = gatefoldOpen ? 0 : -8;
    tx = gatefoldOpen ? 0 :  4;
  }

  /* ── Mouse ── */
  wrapper.addEventListener('mousedown', (e) => {
    isDragging = true; dragMoved = false;
    startX = e.clientX; startY = e.clientY;
    pointerDownTime = Date.now();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) {
      /* Hover parallax */
      const rect = wrapper.getBoundingClientRect();
      const dx = (e.clientX - (rect.left + rect.width  / 2)) / (rect.width  / 2);
      const dy = (e.clientY - (rect.top  + rect.height / 2)) / (rect.height / 2);
      ty = (gatefoldOpen ? 0 : -8) + dx * 11;
      tx = (gatefoldOpen ? 0 :  4) - dy *  7;
      return;
    }
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    ty = (gatefoldOpen ? 0 : -8) + dx * 0.4;
    tx = (gatefoldOpen ? 0 :  4) - dy * 0.25;
  });

  document.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    /* Treat as a click if barely moved and fast */
    if (!dragMoved && Date.now() - pointerDownTime < 280) {
      toggleGatefold();
    } else {
      restAngles();
    }
  });

  /* ── Touch ── */
  let touchStartX = 0, touchStartY = 0, touchMoved = false;

  wrapper.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
    pointerDownTime = Date.now();
  }, { passive: true });

  wrapper.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) touchMoved = true;
    ty = (gatefoldOpen ? 0 : -8) + dx * 0.5;
    tx = (gatefoldOpen ? 0 :  4) - dy * 0.35;
  }, { passive: true });

  wrapper.addEventListener('touchend', (e) => {
    if (!touchMoved && Date.now() - pointerDownTime < 280) {
      toggleGatefold();
    } else {
      restAngles();
    }
  });

  /* ── Gatefold open / close ── */
  function toggleGatefold() {
    gatefoldOpen = !gatefoldOpen;

    if (gatefoldOpen) {
      /* Reset tilt first, then open panels */
      ty = 0; tx = 0;
      gatefold.classList.add('open');

      /* Fade in the inside once panels have swept past 90° */
      setTimeout(() => {
        document.getElementById('gatefoldInside').classList.add('visible');
      }, 380);

      hint.textContent = 'clica novamente para fechar';
      hint.classList.add('visible');

    } else {
      /* Fade out inside before panels close */
      document.getElementById('gatefoldInside').classList.remove('visible');
      setTimeout(() => {
        gatefold.classList.remove('open');
      }, 220);

      hint.textContent = 'clica no cartão para o abrir';
      restAngles();
    }
  }
}
</script>
</body>
</html>
