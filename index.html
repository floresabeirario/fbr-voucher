<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Vale Presente · Flores à Beira-Rio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES.otf') format('opentype');
      font-style: normal;
    }
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES-Italic.otf') format('opentype');
      font-style: italic;
    }

    :root {
      /* Card dimensions: A4 landscape ratio 297/210 = 1.4142 */
      --w: min(740px, 92vw, calc(72vh * 1.4142));
      --h: calc(var(--w) / 1.4142);
      --t: 6px;   /* card thickness (simulates 300g paper) */
      --ht: 3px;  /* half thickness */
      --verde:     #3D6B5E;
      --creme:     #FAF7F0;
      --terracota: #C4846B;
      --ouro:      #B8954A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #080c0a;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 30%, rgba(61,107,94,0.14) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 75% 75%, rgba(184,149,74,0.05) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', 'Product Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Brand ─────────────────────────────────────────────────── */
    .brand {
      position: fixed;
      top: clamp(16px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'TAN Memories', Georgia, serif;
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.18em;
      color: rgba(250,247,240,0.38);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Scene ──────────────────────────────────────────────────── */
    .scene-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ground shadow — separate from preserve-3d to avoid flattening */
    .ground-shadow {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 48px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.72) 0%, transparent 68%);
      filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scene {
      perspective: 1300px;
      perspective-origin: 50% 42%;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      width: var(--w);
      height: var(--h);
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform;
      /* JS handles all transforms. Opacity via class. */
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .card.loaded { opacity: 1; }
    .card:active  { cursor: grabbing; }

    /* ── Faces ──────────────────────────────────────────────────── */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 2px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* PDF loading placeholder — fades once canvas is ready */
    .card-face::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #ede3d4;
      z-index: 2;
      transition: opacity 0.55s ease 0.1s;
      pointer-events: none;
      border-radius: 2px;
    }
    .card-face.ready::before { opacity: 0; }

    /* Subtle gloss layer — makes it feel printed */
    .card-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        128deg,
        rgba(255,255,255,0.055) 0%,
        transparent 42%,
        rgba(0,0,0,0.03) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    /*
      Face transforms.
      Front face at z = +ht (facing viewer).
      Back  face at z = -ht (facing away), rotated 180° on Y.

      For rotateY(180deg) translateZ(ht):
        After rotateY(180deg), local-z points in -world-z direction,
        so translateZ(ht) = −ht in world-z → back face sits at z = −ht. ✓
    */
    .card-front { transform: translateZ(var(--ht)); }
    .card-back  { transform: rotateY(180deg) translateZ(var(--ht)); }

    /* ── Card edges (paper thickness) ──────────────────────────── */
    /*
      Edge geometry derivation (CSS transforms apply left-to-right):
      transform: translateZ(ht) rotateX/Y(±90deg)

      For each edge, transform-origin is at the card's boundary line.
      translateZ(ht) moves that line to the front face (z=+ht).
      The rotation then sweeps the strip from z=+ht to z=−ht.

      Verified for each edge below.
    */
    .card-edge {
      position: absolute;
      background: linear-gradient(
        to right,
        #b8ab99 0%,
        #d8cfc0 22%,
        #ede0ce 50%,
        #d8cfc0 78%,
        #b8ab99 100%
      );
    }

    /* Top: origin at top center. rotateX(-90°) sweeps strip forward (z+→z−). */
    .edge-top {
      top: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: top center;
      transform: translateZ(var(--ht)) rotateX(-90deg);
    }
    /* Bottom: origin at bottom center. rotateX(+90°). */
    .edge-bottom {
      bottom: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: bottom center;
      transform: translateZ(var(--ht)) rotateX(90deg);
    }
    /* Left: origin at left center. rotateY(+90°). */
    .edge-left {
      top: 0; left: 0;
      width: var(--t); height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--ht)) rotateY(90deg);
    }
    /* Right: origin at right center. rotateY(-90°). */
    .edge-right {
      top: 0; right: 0;
      width: var(--t); height: 100%;
      transform-origin: right center;
      transform: translateZ(var(--ht)) rotateY(-90deg);
    }

    /* ── Bottom UI ──────────────────────────────────────────────── */
    .bottom-ui {
      position: fixed;
      bottom: clamp(18px, 3.5vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(250,247,240,0.32);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .hint.show { opacity: 1; }
    .hint svg  { flex-shrink: 0; opacity: 0.65; }

    .btn-flip {
      pointer-events: all;
      background: rgba(61,107,94,0.10);
      border: 1px solid rgba(61,107,94,0.22);
      color: rgba(250,247,240,0.5);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      padding: 7px 20px 8px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.55s ease, background 0.2s, color 0.2s, transform 0.1s;
    }
    .btn-flip.show { opacity: 1; }
    .btn-flip:hover {
      background: rgba(61,107,94,0.20);
      color: rgba(250,247,240,0.85);
    }
    .btn-flip:active { transform: scale(0.96); }

    /* ── Loading spinner (shown while PDF loads, inside face) ───── */
    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .spinner::after {
      content: '';
      width: 28px; height: 28px;
      border: 2px solid rgba(61,107,94,0.18);
      border-top-color: rgba(61,107,94,0.5);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .card-face.ready .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<p class="brand">Flores à Beira-Rio</p>

<div class="scene-wrap">
  <div class="ground-shadow" id="ground-shadow"></div>
  <div class="scene">
    <div class="card" id="card">

      <div class="card-face card-front" id="face-front">
        <canvas id="canvas-front"></canvas>
        <div class="spinner"></div>
      </div>

      <div class="card-face card-back" id="face-back">
        <canvas id="canvas-back"></canvas>
        <div class="spinner"></div>
      </div>

      <div class="card-edge edge-top"></div>
      <div class="card-edge edge-bottom"></div>
      <div class="card-edge edge-left"></div>
      <div class="card-edge edge-right"></div>

    </div>
  </div>
</div>

<div class="bottom-ui">
  <div class="hint" id="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/>
    </svg>
    Arraste para explorar
  </div>
  <button class="btn-flip" id="btn-flip" aria-label="Virar o cartão">
    Virar o cartão
  </button>
</div>

<script>
  /* ── PDF.js ─────────────────────────────────────────────────────── */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ── DOM refs ───────────────────────────────────────────────────── */
  const card        = document.getElementById('card');
  const hint        = document.getElementById('hint');
  const btnFlip     = document.getElementById('btn-flip');
  const groundShadow = document.getElementById('ground-shadow');

  /* ── Spring state ───────────────────────────────────────────────── */
  /*
    rotY  : current Y rotation (degrees) — drives the flip animation
    rotX  : current X tilt (degrees, clamped ±13) — follows vertical drag
    entryY: vertical offset (px) — used only for the entrance animation
    Targets (tY, tX, tEY) are set by snapping logic and drag.
    Velocities (vY, vX, vEY) are updated each tick by spring formula:
      vel = vel * DAMP + (target − pos) * STIFF
  */
  const STIFF = 0.11, DAMP = 0.70;

  let rotY = -22, rotX = 0, entryY = 26;
  let tY = 0,    tX = 0,   tEY = 0;
  let vY = 0,    vX = 0,   vEY = 0;
  let raf = null;

  /* ── Interaction state ──────────────────────────────────────────── */
  let dragging    = false;
  let lx = 0,  ly = 0;
  let interacted  = false;
  let showingBack = false;

  /* ── Apply transform + update shadow ───────────────────────────── */
  function apply() {
    card.style.transform =
      `translateY(${entryY.toFixed(2)}px) ` +
      `rotateY(${rotY.toFixed(3)}deg) ` +
      `rotateX(${rotX.toFixed(3)}deg)`;

    /*
      Shadow: most opaque when card faces viewer (edge-on angle ≈ 90°),
      lighter when card is edge-on to viewer.
    */
    const edgeOn = Math.abs(((rotY % 180) + 180) % 180 - 90); // 0 = edge-on, 90 = face-on
    groundShadow.style.opacity = 0.4 + (edgeOn / 90) * 0.55;
  }

  /* ── Spring tick ────────────────────────────────────────────────── */
  function tick() {
    vY  = vY  * DAMP + (tY  - rotY)   * STIFF;
    vX  = vX  * DAMP + (tX  - rotX)   * STIFF;
    vEY = vEY * DAMP + (tEY - entryY) * STIFF;

    rotY   += vY;
    rotX   += vX;
    entryY += vEY;

    apply();

    const settled =
      Math.abs(tY  - rotY)   < 0.015 && Math.abs(vY)  < 0.015 &&
      Math.abs(tX  - rotX)   < 0.015 && Math.abs(vX)  < 0.015 &&
      Math.abs(tEY - entryY) < 0.015 && Math.abs(vEY) < 0.015;

    if (!settled) {
      raf = requestAnimationFrame(tick);
    } else {
      rotY = tY; rotX = tX; entryY = tEY;
      vY = vX = vEY = 0;
      apply();
      raf = null;
    }
  }

  function startSpring() {
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /* ── Snap to nearest face (0° = front, 180° = back) ────────────── */
  function snapToNearest() {
    const norm    = ((rotY % 360) + 360) % 360;
    const front   = norm < 90 || norm >= 270;
    const base    = Math.round(rotY / 360) * 360;
    let   snap    = front ? base : base + 180;

    /* shortest path */
    while (snap - rotY >  180) snap -= 360;
    while (snap - rotY < -180) snap += 360;

    tY = snap;
    tX = 0;
    showingBack = !front;
  }

  /* ── Drag ───────────────────────────────────────────────────────── */
  function onDown(x, y) {
    dragging = true;
    lx = x; ly = y;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vY = vX = 0;
  }

  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lx, dy = y - ly;
    rotY += dx * 0.46;
    rotX  = Math.max(-13, Math.min(13, rotX - dy * 0.22));
    lx = x; ly = y;
    apply();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    snapToNearest();
    startSpring();
    if (!interacted) {
      interacted = true;
      hint.classList.remove('show');
    }
  }

  /* Mouse */
  card.addEventListener('mousedown', e => {
    e.preventDefault();
    onDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   ()  => onUp());

  /* Touch */
  card.addEventListener('touchstart', e => {
    e.preventDefault();
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('touchend', () => onUp());

  /* ── Flip button ─────────────────────────────────────────────────── */
  btnFlip.addEventListener('click', () => {
    showingBack = !showingBack;
    let snap = showingBack
      ? Math.round(rotY / 360) * 360 + 180
      : Math.round(rotY / 360) * 360;
    while (snap - rotY >  180) snap -= 360;
    while (snap - rotY < -180) snap += 360;
    tY = snap; tX = 0;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vY = vX = 0;
    startSpring();
  });

  /* ── PDF Rendering ───────────────────────────────────────────────── */
  /*
    Render at 2× or 3× pixel density for retina crispness.
    CSS sets canvas to 100%×100% of the face element, so the high-res
    bitmap is downscaled smoothly by the browser.
  */
  const PIXEL_SCALE = Math.min(window.devicePixelRatio >= 2 ? 3 : 2, 3);

  async function renderPage(pdf, pageNum, canvasId, faceId) {
    const page   = await pdf.getPage(pageNum);
    const canvas = document.getElementById(canvasId);
    const face   = document.getElementById(faceId);

    const vp0    = page.getViewport({ scale: 1 });
    const cssW   = canvas.offsetWidth  || 740;
    const scale  = (cssW * PIXEL_SCALE) / vp0.width;
    const vp     = page.getViewport({ scale });

    canvas.width  = Math.round(vp.width);
    canvas.height = Math.round(vp.height);

    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: vp,
    }).promise;

    face.classList.add('ready');
  }

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument('./voucher_azul.pdf').promise;
      await Promise.all([
        renderPage(pdf, 1, 'canvas-front', 'face-front'),
        renderPage(pdf, 2, 'canvas-back',  'face-back'),
      ]);
    } catch (err) {
      console.warn('[fbr-voucher] PDF load failed:', err);
      /* Graceful fallback: show warm cream faces */
      ['face-front', 'face-back'].forEach(id =>
        document.getElementById(id).classList.add('ready')
      );
    }
  }

  /* ── Init ────────────────────────────────────────────────────────── */
  function init() {
    /* Apply initial tilted state before fade-in */
    apply();

    /* Start loading PDF (async, non-blocking) */
    loadPDF();

    /* Fade card in */
    requestAnimationFrame(() => card.classList.add('loaded'));

    /* Run entrance spring: from (rotY=−22, entryY=26) → (0, 0) */
    startSpring();

    /* After entrance settles, show hint and run a wobble tease */
    setTimeout(() => {
      if (interacted) return;

      hint.classList.add('show');
      btnFlip.classList.add('show');

      /* Wobble: lean right, return to center */
      setTimeout(() => {
        if (interacted) return;
        tY = 16;
        startSpring();

        setTimeout(() => {
          if (interacted) return;
          tY = 0;
          startSpring();
        }, 750);
      }, 300);

    }, 1400);
  }

  init();
</script>
</body>
</html>
