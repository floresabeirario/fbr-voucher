<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Vale Presente · Flores à Beira-Rio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES.otf') format('opentype');
      font-style: normal;
    }
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES-Italic.otf') format('opentype');
      font-style: italic;
    }

    :root {
      /* Card dimensions: A4 landscape ratio 297/210 = 1.4142 */
      --w: min(740px, 92vw, calc(72vh * 1.4142));
      --h: calc(var(--w) / 1.4142);
      --hw: calc(var(--w) / 2);   /* half width — each panel */
      --t: 2px;     /* card thickness */
      --ht: 1px;    /* half thickness */
      --verde:     #3D6B5E;
      --creme:     #FAF7F0;
      --terracota: #C4846B;
      --ouro:      #B8954A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #080c0a;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 30%, rgba(61,107,94,0.14) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 75% 75%, rgba(184,149,74,0.05) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', 'Product Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Brand ─────────────────────────────────────────────────── */
    .brand {
      position: fixed;
      top: clamp(16px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'TAN Memories', Georgia, serif;
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.18em;
      color: rgba(250,247,240,0.38);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Scene ──────────────────────────────────────────────────── */
    .scene-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ground shadow */
    .ground-shadow {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 48px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.72) 0%, transparent 68%);
      filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scene {
      perspective: 1300px;
      perspective-origin: 50% 42%;
    }

    /* ── Gatefold container ─────────────────────────────────────── */
    /*
      The gatefold is the rotatable outer shell (drag to tilt/explore).
      Inside it: two panels (left & right) that fold open/closed.
    */
    .gatefold {
      width: var(--w);
      height: var(--h);
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .gatefold.loaded { opacity: 1; }
    .gatefold:active  { cursor: grabbing; }

    /* ── Panels ─────────────────────────────────────────────────── */
    /*
      Each panel is half the card width.
      Left panel  hinges on its RIGHT edge  (transform-origin: right center).
      Right panel hinges on its LEFT  edge  (transform-origin: left center).

      Opening animation:
        left  panel: rotateY(0°) → rotateY(-180°)
        right panel: rotateY(0°) → rotateY(+180°)

      When fully open (±180°) the panels swap sides:
        left  panel (originally left  half) now occupies right half
        right panel (originally right half) now occupies left  half
      The inner face canvases are assigned accordingly (see JS).
    */
    .panel {
      position: absolute;
      top: 0;
      width: var(--hw);
      height: 100%;
      transform-style: preserve-3d;
    }

    .panel-left {
      left: 0;
      transform-origin: right center;
    }

    .panel-right {
      right: 0;
      transform-origin: left center;
    }

    /* ── Panel faces ────────────────────────────────────────────── */
    .panel-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 2px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .panel-face canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /*
      Outer face: faces viewer when panel is at rotateY(0°) — closed state.
      translateZ(ht) places it at the front of the panel's z-space.
    */
    .panel-outer {
      transform: translateZ(var(--ht));
    }

    /*
      Inner face: faces away from viewer when panel is at rotateY(0°).
      rotateY(180deg) turns it around; translateZ(ht) along the now-reversed
      local Z puts it at z = -ht in panel space.
      Becomes visible when the panel has rotated ±180° (open state).
    */
    .panel-inner {
      transform: rotateY(180deg) translateZ(var(--ht));
    }

    /* PDF loading placeholder — fades once canvas is ready */
    .panel-face::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #ede3d4;
      z-index: 2;
      transition: opacity 0.55s ease 0.1s;
      pointer-events: none;
      border-radius: 2px;
    }
    .panel-face.ready::before { opacity: 0; }

    /* Gloss layer */
    .panel-face::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(
        128deg,
        rgba(255,255,255,0.055) 0%,
        transparent 42%,
        rgba(0,0,0,0.03) 100%
      );
    }

    /* Fold-crease shadow on outer faces (only near the center fold) */
    .panel-left  .panel-outer::after {
      background:
        linear-gradient(to right, transparent 80%, rgba(0,0,0,0.13) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }
    .panel-right .panel-outer::after {
      background:
        linear-gradient(to left, transparent 80%, rgba(0,0,0,0.13) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }

    /* ── Panel edges (paper thickness) ─────────────────────────── */
    /*
      Edge geometry: same principle as original card edges.
      transform: translateZ(ht) rotateX/Y(±90°)
      Places each edge strip at the paper boundary.

      Outer edges: left edge of left panel, right edge of right panel.
      Top/bottom edges: on both panels (half-width each).
      Spine edges: right edge of left panel & left edge of right panel
                   (the fold crease — slightly darker).
    */
    .panel-edge {
      position: absolute;
      background: linear-gradient(
        to right,
        #b8ab99 0%,
        #d8cfc0 22%,
        #ede0ce 50%,
        #d8cfc0 78%,
        #b8ab99 100%
      );
    }

    /* Top edge — both panels */
    .p-edge-top {
      top: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: top center;
      transform: translateZ(var(--ht)) rotateX(-90deg);
    }
    /* Bottom edge — both panels */
    .p-edge-bottom {
      bottom: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: bottom center;
      transform: translateZ(var(--ht)) rotateX(90deg);
    }
    /* Outer left edge — left panel only */
    .p-edge-outer-left {
      top: 0; left: 0;
      width: var(--t); height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--ht)) rotateY(90deg);
    }
    /* Outer right edge — right panel only */
    .p-edge-outer-right {
      top: 0; right: 0;
      width: var(--t); height: 100%;
      transform-origin: right center;
      transform: translateZ(var(--ht)) rotateY(-90deg);
    }
    /* Spine / fold-crease edges — slightly darker to suggest the crease */
    .p-edge-spine {
      background: linear-gradient(
        to right,
        rgba(80,60,40,0.18) 0%,
        rgba(40,28,18,0.35) 50%,
        rgba(80,60,40,0.18) 100%
      );
    }
    /* Spine right (right side of left panel) */
    .p-edge-spine-r {
      top: 0; right: 0;
      width: var(--t); height: 100%;
      transform-origin: right center;
      transform: translateZ(var(--ht)) rotateY(-90deg);
    }
    /* Spine left (left side of right panel) */
    .p-edge-spine-l {
      top: 0; left: 0;
      width: var(--t); height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--ht)) rotateY(90deg);
    }

    /* ── Bottom UI ──────────────────────────────────────────────── */
    .bottom-ui {
      position: fixed;
      bottom: clamp(18px, 3.5vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(250,247,240,0.32);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .hint.show { opacity: 1; }
    .hint svg  { flex-shrink: 0; opacity: 0.65; }

    .btn-flip {
      pointer-events: all;
      background: rgba(61,107,94,0.10);
      border: 1px solid rgba(61,107,94,0.22);
      color: rgba(250,247,240,0.5);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      padding: 7px 20px 8px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.55s ease, background 0.2s, color 0.2s, transform 0.1s;
    }
    .btn-flip.show { opacity: 1; }
    .btn-flip:hover {
      background: rgba(61,107,94,0.20);
      color: rgba(250,247,240,0.85);
    }
    .btn-flip:active { transform: scale(0.96); }

    /* ── Loading spinner ────────────────────────────────────────── */
    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .spinner::after {
      content: '';
      width: 28px; height: 28px;
      border: 2px solid rgba(61,107,94,0.18);
      border-top-color: rgba(61,107,94,0.5);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .panel-face.ready .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<p class="brand">Flores à Beira-Rio</p>

<div class="scene-wrap">
  <div class="ground-shadow" id="ground-shadow"></div>
  <div class="scene">
    <div class="gatefold" id="gatefold">

      <!-- ── LEFT PANEL ─────────────────────────────────────────── -->
      <div class="panel panel-left" id="panel-left">

        <!-- Outer face: left half of page 1 (cover), visible when closed -->
        <div class="panel-face panel-outer" id="face-outer-left">
          <canvas id="canvas-outer-left"></canvas>
          <div class="spinner"></div>
        </div>

        <!--
          Inner face: RIGHT half of page 2 (content), visible when open.
          Counter-intuitive but correct: when left panel opens (rotateY -180°)
          it migrates to the RIGHT side of the screen, so its canvas must carry
          the right half of the inner page.
        -->
        <div class="panel-face panel-inner" id="face-inner-left">
          <canvas id="canvas-inner-left"></canvas>
        </div>

        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-left"></div>
        <div class="panel-edge p-edge-spine p-edge-spine-r"></div>
      </div>

      <!-- ── RIGHT PANEL ────────────────────────────────────────── -->
      <div class="panel panel-right" id="panel-right">

        <!-- Outer face: right half of page 1 (cover) -->
        <div class="panel-face panel-outer" id="face-outer-right">
          <canvas id="canvas-outer-right"></canvas>
        </div>

        <!--
          Inner face: LEFT half of page 2 (content).
          Right panel opens (rotateY +180°) → migrates to LEFT side of screen
          → canvas carries the left half of the inner page.
        -->
        <div class="panel-face panel-inner" id="face-inner-right">
          <canvas id="canvas-inner-right"></canvas>
        </div>

        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-right"></div>
        <div class="panel-edge p-edge-spine p-edge-spine-l"></div>
      </div>

    </div>
  </div>
</div>

<div class="bottom-ui">
  <div class="hint" id="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/>
    </svg>
    Arraste para explorar
  </div>
  <button class="btn-flip" id="btn-flip" aria-label="Abrir o cartão">
    Abrir
  </button>
</div>

<script>
  /* ── PDF.js ─────────────────────────────────────────────────────── */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ── DOM refs ───────────────────────────────────────────────────── */
  const gatefold    = document.getElementById('gatefold');
  const panelLeft   = document.getElementById('panel-left');
  const panelRight  = document.getElementById('panel-right');
  const hint        = document.getElementById('hint');
  const btnFlip     = document.getElementById('btn-flip');
  const groundShadow = document.getElementById('ground-shadow');

  /* ── Spring constants ───────────────────────────────────────────── */
  const STIFF      = 0.11,  DAMP      = 0.70;
  const FOLD_STIFF = 0.085, FOLD_DAMP = 0.74;

  /* ── Spring state ───────────────────────────────────────────────── */
  /*
    rotY / rotX / entryY : overall gatefold rotation & entrance offset
    fold                 : 0 = closed (outer faces), 1 = open (inner faces)
  */
  let rotY = -22, rotX = 0, entryY = 26;
  let tY = 0,    tX = 0,   tEY = 0;
  let vY = 0,    vX = 0,   vEY = 0;

  let fold = 0, tFold = 0, vFold = 0;

  let raf = null;

  /* ── Interaction state ──────────────────────────────────────────── */
  let dragging   = false;
  let lx = 0,   ly = 0;
  let interacted = false;
  let foldOpen   = false;

  /* ── Apply all transforms ───────────────────────────────────────── */
  function apply() {
    /* Overall gatefold rotation (drag-to-explore) */
    gatefold.style.transform =
      `translateY(${entryY.toFixed(2)}px) ` +
      `rotateY(${rotY.toFixed(3)}deg) ` +
      `rotateX(${rotX.toFixed(3)}deg)`;

    /* Panel fold: 0° = closed, ±180° = open */
    panelLeft.style.transform  = `rotateY(${(-180 * fold).toFixed(3)}deg)`;
    panelRight.style.transform = `rotateY(${( 180 * fold).toFixed(3)}deg)`;

    /* Ground shadow intensity */
    const edgeOn = Math.abs(((rotY % 180) + 180) % 180 - 90);
    groundShadow.style.opacity = 0.4 + (edgeOn / 90) * 0.55;
  }

  /* ── Spring tick ────────────────────────────────────────────────── */
  function tick() {
    vY    = vY    * DAMP      + (tY    - rotY)   * STIFF;
    vX    = vX    * DAMP      + (tX    - rotX)   * STIFF;
    vEY   = vEY   * DAMP      + (tEY   - entryY) * STIFF;
    vFold = vFold * FOLD_DAMP + (tFold - fold)   * FOLD_STIFF;

    rotY   += vY;
    rotX   += vX;
    entryY += vEY;
    fold   += vFold;

    apply();

    const settled =
      Math.abs(tY    - rotY)   < 0.015 && Math.abs(vY)    < 0.015 &&
      Math.abs(tX    - rotX)   < 0.015 && Math.abs(vX)    < 0.015 &&
      Math.abs(tEY   - entryY) < 0.015 && Math.abs(vEY)   < 0.015 &&
      Math.abs(tFold - fold)   < 0.001 && Math.abs(vFold) < 0.001;

    if (!settled) {
      raf = requestAnimationFrame(tick);
    } else {
      rotY = tY; rotX = tX; entryY = tEY; fold = tFold;
      vY = vX = vEY = vFold = 0;
      apply();
      raf = null;
    }
  }

  function startSpring() {
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /* ── Snap overall rotation back to front-facing ─────────────────── */
  /*
    The gatefold always snaps to 0° (front-facing) — we don't flip the
    entire card; open/close is handled by the fold animation.
    Light tilting (rotX, small rotY) is still allowed while dragging.
  */
  function snapGatefold() {
    tY = Math.round(rotY / 360) * 360;
    while (tY - rotY >  180) tY -= 360;
    while (tY - rotY < -180) tY += 360;
    tX = 0;
  }

  /* ── Drag ───────────────────────────────────────────────────────── */
  function onDown(x, y) {
    dragging = true;
    lx = x; ly = y;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vY = vX = 0;
  }

  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lx, dy = y - ly;
    rotY += dx * 0.46;
    rotX  = Math.max(-13, Math.min(13, rotX - dy * 0.22));
    lx = x; ly = y;
    apply();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    snapGatefold();
    startSpring();
    if (!interacted) {
      interacted = true;
      hint.classList.remove('show');
    }
  }

  /* Mouse */
  gatefold.addEventListener('mousedown', e => {
    e.preventDefault();
    onDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   ()  => onUp());

  /* Touch */
  gatefold.addEventListener('touchstart', e => {
    e.preventDefault();
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  window.addEventListener('touchend', () => onUp());

  /* ── Open / Close button ────────────────────────────────────────── */
  btnFlip.addEventListener('click', () => {
    foldOpen = !foldOpen;
    tFold = foldOpen ? 1 : 0;

    /* Snap gatefold to front before folding for a clean animation */
    tY = Math.round(rotY / 360) * 360;
    while (tY - rotY >  180) tY -= 360;
    while (tY - rotY < -180) tY += 360;
    tX = 0;

    btnFlip.textContent = foldOpen ? 'Fechar' : 'Abrir';
    btnFlip.setAttribute('aria-label', foldOpen ? 'Fechar o cartão' : 'Abrir o cartão');

    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vFold = 0;
    startSpring();
  });

  /* ── PDF Rendering ───────────────────────────────────────────────── */
  /*
    Render at 2× or 3× pixel density for retina crispness.
    Strategy:
      1. Render full PDF page to an offscreen canvas at full card width.
      2. Use drawImage to copy the appropriate half to each panel canvas.

    Inner face canvas assignment (counter-intuitive but geometrically correct):
      canvas-inner-left  ← right half of page 2
        (left panel opens → moves to right side of screen)
      canvas-inner-right ← left half of page 2
        (right panel opens → moves to left side of screen)
  */
  const PIXEL_SCALE = Math.min(window.devicePixelRatio >= 2 ? 3 : 2, 3);

  async function renderFullPage(pdf, pageNum) {
    const page  = await pdf.getPage(pageNum);
    const vp0   = page.getViewport({ scale: 1 });

    /* Scale so the full page fills the card's CSS width at PIXEL_SCALE */
    const refCanvas = document.getElementById('canvas-outer-left');
    const cssFullW  = (refCanvas.offsetWidth  || 370) * 2;
    const scale     = (cssFullW * PIXEL_SCALE) / vp0.width;
    const vp        = page.getViewport({ scale });

    const offscreen = document.createElement('canvas');
    offscreen.width  = Math.round(vp.width);
    offscreen.height = Math.round(vp.height);

    await page.render({
      canvasContext: offscreen.getContext('2d'),
      viewport: vp,
    }).promise;

    return offscreen;
  }

  function copyHalf(src, dst, side) {
    const sw = src.width;
    const sh = src.height;
    const hw = Math.floor(sw / 2);

    dst.width  = hw;
    dst.height = sh;

    const ctx = dst.getContext('2d');
    if (side === 'left') {
      ctx.drawImage(src, 0,  0, hw, sh, 0, 0, hw, sh);
    } else {
      ctx.drawImage(src, hw, 0, hw, sh, 0, 0, hw, sh);
    }
  }

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument('./voucher_azul.pdf').promise;

      const [pageOuter, pageInner] = await Promise.all([
        renderFullPage(pdf, 1),  /* outer / cover page */
        renderFullPage(pdf, 2),  /* inner content page */
      ]);

      /* Outer faces — straightforward halves */
      copyHalf(pageOuter, document.getElementById('canvas-outer-left'),  'left');
      copyHalf(pageOuter, document.getElementById('canvas-outer-right'), 'right');

      /* Inner faces — SWAPPED (see comment above) */
      copyHalf(pageInner, document.getElementById('canvas-inner-left'),  'right');
      copyHalf(pageInner, document.getElementById('canvas-inner-right'), 'left');

      /* Mark all faces ready (fades out the cream placeholder) */
      ['face-outer-left', 'face-outer-right', 'face-inner-left', 'face-inner-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));

    } catch (err) {
      console.warn('[fbr-voucher] PDF load failed:', err);
      ['face-outer-left', 'face-outer-right', 'face-inner-left', 'face-inner-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));
    }
  }

  /* ── Init ────────────────────────────────────────────────────────── */
  function init() {
    apply();

    loadPDF();

    requestAnimationFrame(() => gatefold.classList.add('loaded'));

    /* Entrance spring: (rotY=−22, entryY=26) → (0, 0) */
    startSpring();

    setTimeout(() => {
      if (interacted) return;

      hint.classList.add('show');
      btnFlip.classList.add('show');

      /* Wobble tease */
      setTimeout(() => {
        if (interacted) return;
        tY = 16;
        startSpring();

        setTimeout(() => {
          if (interacted) return;
          tY = 0;
          startSpring();
        }, 750);
      }, 300);
