<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Vale Presente · Flores à Beira-Rio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES.otf') format('opentype');
      font-style: normal;
    }
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES-Italic.otf') format('opentype');
      font-style: italic;
    }

    :root {
      /* Full card: A4 landscape — 297/210 = 1.4142 */
      --w:  min(740px, 92vw, calc(72vh * 1.4142));
      --h:  calc(var(--w) / 1.4142);
      --pw: calc(var(--w) / 3);   /* one panel = one third */
      --t:  2px;                  /* paper thickness */
      --ht: 1px;                  /* half thickness */
      --verde:     #3D6B5E;
      --creme:     #FAF7F0;
      --terracota: #C4846B;
      --ouro:      #B8954A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #080c0a;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 30%, rgba(61,107,94,0.14) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 75% 75%, rgba(184,149,74,0.05) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', 'Product Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Brand ──────────────────────────────────────────────────── */
    .brand {
      position: fixed;
      top: clamp(16px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'TAN Memories', Georgia, serif;
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.18em;
      color: rgba(250,247,240,0.38);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Scene ──────────────────────────────────────────────────── */
    .scene-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ground-shadow {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 48px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.72) 0%, transparent 68%);
      filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scene {
      perspective: 1300px;
      perspective-origin: 50% 42%;
    }

    /* ── Gatefold (outer shell — rotates on drag) ───────────────── */
    /*
      3-panel gatefold:
        ┌──────────┬──────────┬──────────┐
        │ flap-L   │  center  │  flap-R  │  ← OPEN (flat, fold=1)
        └──────────┴──────────┴──────────┘

        ├──(fold)──┤          ├──(fold)──┤
        flap-L hinge = right edge of left panel  (x = W/3)
        flap-R hinge = left  edge of right panel (x = 2W/3)

      CLOSED (fold=0):
        left  flap → rotateY(-180°) — folds backward over center
        right flap → rotateY(+180°) — folds backward over center
      OPEN (fold=1):
        both flaps → rotateY(0°) — fully unfolded, flat
    */
    .gatefold {
      width: var(--w);
      height: var(--h);
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .gatefold.loaded { opacity: 1; }
    .gatefold:active  { cursor: grabbing; }

    /* ── Panels ─────────────────────────────────────────────────── */
    .panel {
      position: absolute;
      top: 0;
      width: var(--pw);
      height: 100%;
      transform-style: preserve-3d;
    }

    /* Center panel: never rotates, declared first → renders behind flaps */
    .panel-center {
      left: var(--pw);
    }

    /* Left flap: hinge at its right edge */
    .flap-left {
      left: 0;
      transform-origin: right center;
    }

    /* Right flap: hinge at its left edge */
    .flap-right {
      right: 0;
      transform-origin: left center;
    }

    /* ── Panel faces ────────────────────────────────────────────── */
    /*
      face-front  : visible at rotateY(0°)   → INNER CONTENT (open state)
      face-back   : visible at rotateY(±180°) → OUTER COVER  (closed state)

      Center panel has no back face (it never rotates, always shows content).
      The center front face sits at z = ht − 0.5px so that flap cover faces
      (at z = ht) always render in front of it when the flaps are closed over it.
    */
    .panel-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 2px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .panel-face canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Front face (inner content) — slightly recessed for center panel */
    .face-front {
      transform: translateZ(var(--ht));
    }
    .panel-center .face-front {
      transform: translateZ(calc(var(--ht) - 0.5px));
    }

    /* Back face (outer cover) — back of each flap */
    .face-back {
      transform: rotateY(180deg) translateZ(var(--ht));
    }

    /* PDF loading placeholder */
    .panel-face::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #ede3d4;
      z-index: 2;
      transition: opacity 0.55s ease 0.1s;
      pointer-events: none;
      border-radius: 2px;
    }
    .panel-face.ready::before { opacity: 0; }

    /* Gloss */
    .panel-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        128deg,
        rgba(255,255,255,0.055) 0%,
        transparent 42%,
        rgba(0,0,0,0.03) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* Fold-crease shadow near the spine edges (inner faces only) */
    .flap-left  .face-front::after {
      background:
        linear-gradient(to right, transparent 82%, rgba(0,0,0,0.11) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }
    .flap-right .face-front::after {
      background:
        linear-gradient(to left,  transparent 82%, rgba(0,0,0,0.11) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }
    .panel-center .face-front::after {
      background:
        linear-gradient(to right, rgba(0,0,0,0.07) 0%, transparent 8%, transparent 92%, rgba(0,0,0,0.07) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }

    /* ── Paper edges ────────────────────────────────────────────── */
    .panel-edge {
      position: absolute;
      background: linear-gradient(
        to right,
        #b8ab99 0%, #d8cfc0 22%, #ede0ce 50%, #d8cfc0 78%, #b8ab99 100%
      );
    }
    .p-edge-top {
      top: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: top center;
      transform: translateZ(var(--ht)) rotateX(-90deg);
    }
    .p-edge-bottom {
      bottom: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: bottom center;
      transform: translateZ(var(--ht)) rotateX(90deg);
    }
    /* Outer left edge of the whole gatefold */
    .p-edge-outer-left {
      top: 0; left: 0;
      width: var(--t); height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--ht)) rotateY(90deg);
    }
    /* Outer right edge of the whole gatefold */
    .p-edge-outer-right {
      top: 0; right: 0;
      width: var(--t); height: 100%;
      transform-origin: right center;
      transform: translateZ(var(--ht)) rotateY(-90deg);
    }

    /* ── Bottom UI ──────────────────────────────────────────────── */
    .bottom-ui {
      position: fixed;
      bottom: clamp(18px, 3.5vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(250,247,240,0.32);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .hint.show { opacity: 1; }
    .hint svg  { flex-shrink: 0; opacity: 0.65; }

    .btn-flip {
      pointer-events: all;
      background: rgba(61,107,94,0.10);
      border: 1px solid rgba(61,107,94,0.22);
      color: rgba(250,247,240,0.5);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      padding: 7px 20px 8px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.55s ease, background 0.2s, color 0.2s, transform 0.1s;
    }
    .btn-flip.show { opacity: 1; }
    .btn-flip:hover {
      background: rgba(61,107,94,0.20);
      color: rgba(250,247,240,0.85);
    }
    .btn-flip:active { transform: scale(0.96); }

    /* ── Spinner ────────────────────────────────────────────────── */
    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .spinner::after {
      content: '';
      width: 28px; height: 28px;
      border: 2px solid rgba(61,107,94,0.18);
      border-top-color: rgba(61,107,94,0.5);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .panel-face.ready .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<p class="brand">Flores à Beira-Rio</p>

<div class="scene-wrap">
  <div class="ground-shadow" id="ground-shadow"></div>
  <div class="scene">
    <div class="gatefold" id="gatefold">

      <!--
        CENTER PANEL — fixed, never rotates.
        Declared first so it renders behind the flaps (CSS 3D painter order).
      -->
      <div class="panel panel-center" id="panel-center">
        <div class="panel-face face-front" id="face-inner-center">
          <canvas id="canvas-inner-center"></canvas>
          <div class="spinner"></div>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
      </div>

      <!--
        LEFT FLAP — hinge: right edge (x = W/3).
        CLOSED: rotateY(-180°) — folds backward over center.
        OPEN:   rotateY(0°).
        face-front canvas = left third of page 1 (inner content).
        face-back  canvas = center third of page 2 (cover, shown when closed).
      -->
      <div class="panel flap-left" id="flap-left">
        <div class="panel-face face-front" id="face-inner-left">
          <canvas id="canvas-inner-left"></canvas>
        </div>
        <div class="panel-face face-back" id="face-cover-left">
          <canvas id="canvas-cover-left"></canvas>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-left"></div>
      </div>

      <!--
        RIGHT FLAP — hinge: left edge (x = 2W/3).
        CLOSED: rotateY(+180°) — folds backward over center.
        OPEN:   rotateY(0°).
        face-front canvas = right third of page 1 (inner content).
        face-back  canvas = center third of page 2 (cover, shown when closed).
        Declared last → renders in front of left flap when both are closed.
      -->
      <div class="panel flap-right" id="flap-right">
        <div class="panel-face face-front" id="face-inner-right">
          <canvas id="canvas-inner-right"></canvas>
        </div>
        <div class="panel-face face-back" id="face-cover-right">
          <canvas id="canvas-cover-right"></canvas>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-right"></div>
      </div>

    </div>
  </div>
</div>

<div class="bottom-ui">
  <div class="hint" id="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/>
    </svg>
    Arraste para explorar
  </div>
  <button class="btn-flip" id="btn-flip" aria-label="Abrir o cartão">
    Abrir
  </button>
</div>

<script>
  /* ── PDF.js ─────────────────────────────────────────────────────── */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ── DOM refs ───────────────────────────────────────────────────── */
  const gatefold    = document.getElementById('gatefold');
  const flapLeft    = document.getElementById('flap-left');
  const flapRight   = document.getElementById('flap-right');
  const hint        = document.getElementById('hint');
  const btnFlip     = document.getElementById('btn-flip');
  const groundShadow = document.getElementById('ground-shadow');

  /* ── Spring constants ───────────────────────────────────────────── */
  const STIFF      = 0.11,  DAMP      = 0.70;
  const FOLD_STIFF = 0.08,  FOLD_DAMP = 0.74;

  /* ── Spring state ───────────────────────────────────────────────── */
  /*
    rotY / rotX / entryY : overall gatefold tilt & entrance offset
    fold  : 0 = CLOSED (flaps at ±180°), 1 = OPEN (flaps at 0°)
  */
  let rotY = -22, rotX = 0, entryY = 26;
  let tY = 0,    tX = 0,   tEY = 0;
  let vY = 0,    vX = 0,   vEY = 0;

  let fold = 0, tFold = 0, vFold = 0;

  let raf = null;

  /* ── Interaction state ──────────────────────────────────────────── */
  let dragging   = false;
  let lx = 0,   ly = 0;
  let interacted = false;
  let isOpen     = false;   /* tracks whether gatefold is open */

  /* ── Apply transforms ───────────────────────────────────────────── */
  function apply() {
    /* Overall gatefold tilt (drag) */
    gatefold.style.transform =
      `translateY(${entryY.toFixed(2)}px) ` +
      `rotateY(${rotY.toFixed(3)}deg) ` +
      `rotateX(${rotX.toFixed(3)}deg)`;

    /*
      Flap fold:
        fold = 0 (CLOSED): left = -180°, right = +180°
        fold = 1 (OPEN):   left =    0°, right =    0°
    */
    flapLeft.style.transform  = `rotateY(${(-180 * (1 - fold)).toFixed(3)}deg)`;
    flapRight.style.transform = `rotateY(${( 180 * (1 - fold)).toFixed(3)}deg)`;

    /* Ground shadow — brightest when face-on to viewer */
    const edgeOn = Math.abs(((rotY % 180) + 180) % 180 - 90);
    groundShadow.style.opacity = 0.4 + (edgeOn / 90) * 0.55;
  }

  /* ── Spring tick ────────────────────────────────────────────────── */
  function tick() {
    vY    = vY    * DAMP      + (tY    - rotY)   * STIFF;
    vX    = vX    * DAMP      + (tX    - rotX)   * STIFF;
    vEY   = vEY   * DAMP      + (tEY   - entryY) * STIFF;
    vFold = vFold * FOLD_DAMP + (tFold - fold)   * FOLD_STIFF;

    rotY   += vY;
    rotX   += vX;
    entryY += vEY;
    fold   += vFold;

    apply();

    const settled =
      Math.abs(tY    - rotY)   < 0.015 && Math.abs(vY)    < 0.015 &&
      Math.abs(tX    - rotX)   < 0.015 && Math.abs(vX)    < 0.015 &&
      Math.abs(tEY   - entryY) < 0.015 && Math.abs(vEY)   < 0.015 &&
      Math.abs(tFold - fold)   < 0.001 && Math.abs(vFold) < 0.001;

    if (!settled) {
      raf = requestAnimationFrame(tick);
    } else {
      rotY = tY; rotX = tX; entryY = tEY; fold = tFold;
      vY = vX = vEY = vFold = 0;
      apply();
      raf = null;
    }
  }

  function startSpring() {
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /* ── Snap overall rotation to front-facing ──────────────────────── */
  function snapGatefold() {
    tY = Math.round(rotY / 360) * 360;
    while (tY - rotY >  180) tY -= 360;
    while (tY - rotY < -180) tY += 360;
    tX = 0;
  }

  /* ── Drag ───────────────────────────────────────────────────────── */
  function onDown(x, y) {
    dragging = true;
    lx = x; ly = y;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vY = vX = 0;
  }

  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lx, dy = y - ly;
    rotY += dx * 0.46;
    rotX  = Math.max(-13, Math.min(13, rotX - dy * 0.22));
    lx = x; ly = y;
    apply();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    snapGatefold();
    startSpring();
    if (!interacted) {
      interacted = true;
      hint.classList.remove('show');
    }
  }

  /* Mouse */
  gatefold.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   ()  => onUp());

  /* Touch */
  gatefold.addEventListener('touchstart', e => {
    e.preventDefault();
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchend', () => onUp());

  /* ── Open / Close button ────────────────────────────────────────── */
  btnFlip.addEventListener('click', () => {
    isOpen = !isOpen;
    tFold  = isOpen ? 1 : 0;

    /* Snap to front for a clean fold animation */
    tY = Math.round(rotY / 360) * 360;
    while (tY - rotY >  180) tY -= 360;
    while (tY - rotY < -180) tY += 360;
    tX = 0;

    btnFlip.textContent = isOpen ? 'Fechar' : 'Abrir';
    btnFlip.setAttribute('aria-label', isOpen ? 'Fechar o cartão' : 'Abrir o cartão');

    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vFold = 0;
    startSpring();
  });

  /* ── PDF rendering ───────────────────────────────────────────────── */
  /*
    High-DPI rendering:
      1. Render each PDF page to a full-width offscreen canvas.
      2. Copy one third (left / center / right) to each panel's canvas.

    Canvas assignment:
      face-front (inner content, visible when OPEN = fold 1):
        canvas-inner-left   ← left   third of page 1
        canvas-inner-center ← center third of page 1
        canvas-inner-right  ← right  third of page 1

      face-back (cover, visible when CLOSED = fold 0):
        When a flap is closed (rotateY ±180°) its back face occupies
        world x ∈ [W/3, 2W/3] — exactly the center panel area.
        Both flap back faces map to the same world position; the right
        flap renders on top (last in DOM). Both get the center third
        of page 2 so it doesn't matter which is in front.
        canvas-cover-left  ← center third of page 2
        canvas-cover-right ← center third of page 2
  */
  const PIXEL_SCALE = Math.min(window.devicePixelRatio >= 2 ? 3 : 2, 3);

  async function renderFullPage(pdf, pageNum) {
    const page = await pdf.getPage(pageNum);
    const vp0  = page.getViewport({ scale: 1 });

    /* Render at full card width × PIXEL_SCALE */
    const refCanvas = document.getElementById('canvas-inner-center');
    const cssFullW  = (refCanvas.offsetWidth || 247) * 3;
    const scale     = (cssFullW * PIXEL_SCALE) / vp0.width;
    const vp        = page.getViewport({ scale });

    const offscreen = document.createElement('canvas');
    offscreen.width  = Math.round(vp.width);
    offscreen.height = Math.round(vp.height);

    await page.render({ canvasContext: offscreen.getContext('2d'), viewport: vp }).promise;
    return offscreen;
  }

  function copyThird(src, dst, part) {
    const sw = src.width;
    const sh = src.height;
    const tw = Math.floor(sw / 3);
    const sx = part === 'left' ? 0 : part === 'center' ? tw : 2 * tw;

    dst.width  = tw;
    dst.height = sh;
    dst.getContext('2d').drawImage(src, sx, 0, tw, sh, 0, 0, tw, sh);
  }

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument('./voucher_azul.pdf').promise;

      const [page1, page2] = await Promise.all([
        renderFullPage(pdf, 1),   /* inner content (open state) */
        renderFullPage(pdf, 2),   /* exterior cover (closed state) */
      ]);

      /* Inner content: page 1 in thirds */
      copyThird(page1, document.getElementById('canvas-inner-left'),   'left');
      copyThird(page1, document.getElementById('canvas-inner-center'), 'center');
      copyThird(page1, document.getElementById('canvas-inner-right'),  'right');

      /* Cover: center third of page 2 (both flap back faces map here) */
      copyThird(page2, document.getElementById('canvas-cover-left'),  'center');
      copyThird(page2, document.getElementById('canvas-cover-right'), 'center');

      ['face-inner-center','face-inner-left','face-inner-right',
       'face-cover-left','face-cover-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));

    } catch (err) {
      console.warn('[fbr-voucher] PDF load failed:', err);
      ['face-inner-center','face-inner-left','face-inner-right',
       'face-cover-left','face-cover-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));
    }
  }

  /* ── Init ────────────────────────────────────────────────────────── */
  function init() {
    /* Start closed (fold = 0) */
    fold  = 0;
    tFold = 0;

    apply();
    loadPDF();

    requestAnimationFrame(() => gatefold.classList.add('loaded'));

    /* Entrance spring: (rotY=−22, entryY=26) → (0, 0) */
    startSpring();

    /* After entrance: show UI + subtle fold tease */
    setTimeout(() => {
      if (interacted) return;

      hint.classList.add('show');
      btnFlip.classList.add('show');

      /* Slight fold peek then close back */
      setTimeout(() => {
        if (interacted) return;
        tFold = 0.12;
        startSpring();
        setTimeout(() => {
          if (interacted) return;
          tFold = 0;
          startSpring();
        }, 700);
      }, 300);

    }, 1400);
  }

  init();
</script>
