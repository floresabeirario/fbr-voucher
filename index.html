<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Vale Presente · Flores à Beira-Rio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES.otf') format('opentype');
      font-style: normal;
    }
    @font-face {
      font-family: 'TAN Memories';
      src: url('./fonts/TAN-MEMORIES-Italic.otf') format('opentype');
      font-style: italic;
    }

    :root {
      /* Full card: A4 landscape — 297/210 ≈ 1.4142 */
      --w:  min(740px, 92vw, calc(72vh * 1.4142));
      --h:  calc(var(--w) / 1.4142);
      --pw: calc(var(--w) / 4);         /* flap width  = 25% */
      --cw: calc(var(--w) / 2);         /* center width = 50% */
      --t:  2px;                        /* paper thickness */
      --ht: 1px;
      --verde:     #3D6B5E;
      --creme:     #FAF7F0;
      --terracota: #C4846B;
      --ouro:      #B8954A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: #080c0a;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 30%, rgba(61,107,94,0.14) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 75% 75%, rgba(184,149,74,0.05) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', 'Product Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Brand ──────────────────────────────────────────────────── */
    .brand {
      position: fixed;
      top: clamp(16px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'TAN Memories', Georgia, serif;
      font-size: clamp(11px, 1.15vw, 15px);
      letter-spacing: 0.18em;
      color: rgba(250,247,240,0.38);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Scene ──────────────────────────────────────────────────── */
    .scene-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ground-shadow {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 48px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.72) 0%, transparent 68%);
      filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scene {
      perspective: 1300px;
      perspective-origin: 50% 42%;
    }

    /* ── Gatefold ───────────────────────────────────────────────── */
    /*
      Layout (open, all panels flat):
        ┌─────────┬──────────────────┬─────────┐
        │  25%    │       50%        │   25%   │
        │ flap-L  │     center       │ flap-R  │
        └─────────┴──────────────────┴─────────┘
                  ↑                  ↑
              hinge at W/4       hinge at 3W/4

      CLOSED  (fold=0): left flap rotateY(-180°), right flap rotateY(+180°)
                         → flaps fold backward over center
      OPEN    (fold=1): both flaps at rotateY(0°) — fully flat

      PDF page assignment:
        Page 1 (inner content, seen when OPEN from front):
          canvas-inner-left   = page1  [0% – 25%]
          canvas-inner-center = page1  [25% – 75%]
          canvas-inner-right  = page1  [75% – 100%]

        Page 2 (exterior, seen when looking at back or closed):
          canvas-center-back  = page2  [25% – 75%]  (static — center panel back face)

          Flap back-face canvases are DYNAMIC (swapped at fold = 0.5):
            ┌─ CLOSED side (fold < 0.5) ────────────────────────────────┐
            │ canvas-cover-left  = page2 [0%  – 25%]  (left lateral)    │
            │ canvas-cover-right = page2 [75% – 100%] (right lateral)   │
            │ → together they show page2 outer 50% on the front         │
            │   center-back (always page2 [25–75%]) shows on back  ✓    │
            └───────────────────────────────────────────────────────────┘
            ┌─ OPEN side (fold > 0.5) ──────────────────────────────────┐
            │ canvas-cover-left  = page2 [75% – 100%]                   │
            │ canvas-cover-right = page2 [0%  – 25%]                    │
            │ → when gatefold is flipped (rotY=180°) these map to:      │
            │     cover-right @ screen-left  (0–25%) = page2 [0–25%]   │
            │     center-back @ screen-center        = page2 [25–75%]  │
            │     cover-left  @ screen-right (75–100%)= page2 [75–100%]│
            │ → full page 2 visible ✓                                   │
            └───────────────────────────────────────────────────────────┘
    */
    .gatefold {
      width: var(--w);
      height: var(--h);
      position: relative;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform;
      opacity: 0;
      transition: opacity 0.7s ease;
    }
    .gatefold.loaded { opacity: 1; }
    .gatefold:active  { cursor: grabbing; }

    /* ── Panels ─────────────────────────────────────────────────── */
    .panel {
      position: absolute;
      top: 0;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* Center panel (50%): fixed, no rotation. Declared first → renders
       behind flaps when coplanar (CSS 3D painter order). */
    .panel-center {
      left: var(--pw);
      width: var(--cw);
    }

    /* Left flap (25%): hinge at its right edge (x = W/4) */
    .flap-left {
      left: 0;
      width: var(--pw);
      transform-origin: right center;
    }

    /* Right flap (25%): hinge at its left edge (x = 3W/4) */
    .flap-right {
      right: 0;
      width: var(--pw);
      transform-origin: left center;
    }

    /* ── Faces ──────────────────────────────────────────────────── */
    .panel-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 2px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .panel-face canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Front face: visible at rotateY(0°) — inner content (open state) */
    .face-front { transform: translateZ(var(--ht)); }

    /* Center panel front sits 0.5 px behind flap faces so flaps
       always render in front when coplanar (closed state). */
    .panel-center .face-front {
      transform: translateZ(calc(var(--ht) - 0.5px));
    }

    /* Back face: visible at rotateY(±180°) — exterior/cover */
    .face-back { transform: rotateY(180deg) translateZ(var(--ht)); }

    /* Center back face gets extra Z so it wins the Z-order battle against
       flap front-faces when the closed gatefold is flipped to show the back.
       (Flap fronts land at world-z = +ht when closed; center back must be > that.) */
    .panel-center .face-back {
      transform: rotateY(180deg) translateZ(calc(var(--ht) + 2px));
    }

    /* PDF loading placeholder */
    .panel-face::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #ede3d4;
      z-index: 2;
      transition: opacity 0.55s ease 0.1s;
      pointer-events: none;
      border-radius: 2px;
    }
    .panel-face.ready::before { opacity: 0; }

    /* Gloss */
    .panel-face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        128deg,
        rgba(255,255,255,0.055) 0%,
        transparent 42%,
        rgba(0,0,0,0.03) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    /* Fold-crease shadow at the hinge edges of the inner faces */
    .flap-left  .face-front::after {
      background:
        linear-gradient(to right, transparent 82%, rgba(0,0,0,0.11) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }
    .flap-right .face-front::after {
      background:
        linear-gradient(to left,  transparent 82%, rgba(0,0,0,0.11) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }
    .panel-center .face-front::after {
      background:
        linear-gradient(to right, rgba(0,0,0,0.07) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.07) 100%),
        linear-gradient(128deg, rgba(255,255,255,0.055) 0%, transparent 42%, rgba(0,0,0,0.03) 100%);
    }

    /* ── Paper edges ────────────────────────────────────────────── */
    .panel-edge {
      position: absolute;
      background: linear-gradient(
        to right,
        #b8ab99 0%, #d8cfc0 22%, #ede0ce 50%, #d8cfc0 78%, #b8ab99 100%
      );
    }
    .p-edge-top {
      top: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: top center;
      transform: translateZ(var(--ht)) rotateX(-90deg);
    }
    .p-edge-bottom {
      bottom: 0; left: 0;
      width: 100%; height: var(--t);
      transform-origin: bottom center;
      transform: translateZ(var(--ht)) rotateX(90deg);
    }
    .p-edge-outer-left {
      top: 0; left: 0;
      width: var(--t); height: 100%;
      transform-origin: left center;
      transform: translateZ(var(--ht)) rotateY(90deg);
    }
    .p-edge-outer-right {
      top: 0; right: 0;
      width: var(--t); height: 100%;
      transform-origin: right center;
      transform: translateZ(var(--ht)) rotateY(-90deg);
    }

    /* ── Bottom UI ──────────────────────────────────────────────── */
    .bottom-ui {
      position: fixed;
      bottom: clamp(18px, 3.5vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(250,247,240,0.32);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.55s ease;
    }
    .hint.show { opacity: 1; }
    .hint svg  { flex-shrink: 0; opacity: 0.65; }

    /* ── Spinner ────────────────────────────────────────────────── */
    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    .spinner::after {
      content: '';
      width: 28px; height: 28px;
      border: 2px solid rgba(61,107,94,0.18);
      border-top-color: rgba(61,107,94,0.5);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .panel-face.ready .spinner { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<p class="brand">Flores à Beira-Rio</p>

<div class="scene-wrap">
  <div class="ground-shadow" id="ground-shadow"></div>
  <div class="scene">
    <div class="gatefold" id="gatefold">

      <!--
        CENTER PANEL (50%) — fixed, declared first → behind flaps.
        front: page1 [25–75%]  |  back: page2 [25–75%]
      -->
      <div class="panel panel-center" id="panel-center">
        <div class="panel-face face-front" id="face-inner-center">
          <canvas id="canvas-inner-center"></canvas>
          <div class="spinner"></div>
        </div>
        <div class="panel-face face-back" id="face-center-back">
          <canvas id="canvas-center-back"></canvas>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
      </div>

      <!--
        LEFT FLAP (25%) — hinge: right edge.
        front: page1 [0–25%]
        back (dynamic):
          closed side → page2 [25–50%]  (shows left half of closed cover)
          open side   → page2 [75–100%] (shows right quarter when flipped)
      -->
      <div class="panel flap-left" id="flap-left">
        <div class="panel-face face-front" id="face-inner-left">
          <canvas id="canvas-inner-left"></canvas>
        </div>
        <div class="panel-face face-back" id="face-cover-left">
          <canvas id="canvas-cover-left"></canvas>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-left"></div>
      </div>

      <!--
        RIGHT FLAP (25%) — hinge: left edge. Declared last → in front.
        front: page1 [75–100%]
        back (dynamic):
          closed side → page2 [50–75%]  (shows right half of closed cover)
          open side   → page2 [0–25%]   (shows left quarter when flipped)
      -->
      <div class="panel flap-right" id="flap-right">
        <div class="panel-face face-front" id="face-inner-right">
          <canvas id="canvas-inner-right"></canvas>
        </div>
        <div class="panel-face face-back" id="face-cover-right">
          <canvas id="canvas-cover-right"></canvas>
        </div>
        <div class="panel-edge p-edge-top"></div>
        <div class="panel-edge p-edge-bottom"></div>
        <div class="panel-edge p-edge-outer-right"></div>
      </div>

    </div>
  </div>
</div>

<div class="bottom-ui">
  <div class="hint" id="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/>
    </svg>
    Clique para abrir · arraste para explorar
  </div>
</div>

<script>
  /* ── PDF.js ─────────────────────────────────────────────────────── */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* ── DOM refs ───────────────────────────────────────────────────── */
  const gatefold     = document.getElementById('gatefold');
  const flapLeft     = document.getElementById('flap-left');
  const flapRight    = document.getElementById('flap-right');
  const hint         = document.getElementById('hint');
  const groundShadow = document.getElementById('ground-shadow');

  const cvCoverL     = document.getElementById('canvas-cover-left');
  const cvCoverR     = document.getElementById('canvas-cover-right');

  /* ── Spring constants ───────────────────────────────────────────── */
  const STIFF      = 0.11,  DAMP      = 0.70;
  const FOLD_STIFF = 0.08,  FOLD_DAMP = 0.74;

  /* ── Spring state ───────────────────────────────────────────────── */
  let rotY = -22, rotX = 0, entryY = 26;
  let tY = 0,    tX = 0,   tEY = 0;
  let vY = 0,    vX = 0,   vEY = 0;

  /* fold: 0 = CLOSED (flaps ±180°), 1 = OPEN (flaps 0°) */
  let fold = 0, tFold = 0, vFold = 0;

  let raf = null;

  /* ── Interaction state ──────────────────────────────────────────── */
  let dragging   = false;
  let lx = 0,   ly = 0;
  let interacted = false;
  let isOpen     = false;

  /* ── Dynamic canvas tracking ────────────────────────────────────── */
  /*
    coverSide: 'closed' | 'open'
    Flap back-face canvases are swapped when fold crosses 0.5.
    Swap happens at ≈90° fold angle — panels are edge-on, invisible to user.
  */
  let coverSide = 'closed';
  let page2Offscreen = null;   /* stored after PDF load for dynamic reuse */

  /* ── Apply transforms ───────────────────────────────────────────── */
  function apply() {
    gatefold.style.transform =
      `translateY(${entryY.toFixed(2)}px) ` +
      `rotateY(${rotY.toFixed(3)}deg) ` +
      `rotateX(${rotX.toFixed(3)}deg)`;

    /* fold=0 → flaps at ±180° (closed), fold=1 → flaps at 0° (open) */
    flapLeft.style.transform  = `rotateY(${(-180 * (1 - fold)).toFixed(3)}deg)`;
    flapRight.style.transform = `rotateY(${( 180 * (1 - fold)).toFixed(3)}deg)`;

    const edgeOn = Math.abs(((rotY % 180) + 180) % 180 - 90);
    groundShadow.style.opacity = 0.4 + (edgeOn / 90) * 0.55;
  }

  /* ── Spring tick ────────────────────────────────────────────────── */
  function tick() {
    vY    = vY    * DAMP      + (tY    - rotY)   * STIFF;
    vX    = vX    * DAMP      + (tX    - rotX)   * STIFF;
    vEY   = vEY   * DAMP      + (tEY   - entryY) * STIFF;
    vFold = vFold * FOLD_DAMP + (tFold - fold)   * FOLD_STIFF;

    rotY   += vY;
    rotX   += vX;
    entryY += vEY;
    fold   += vFold;

    /* Swap cover canvases at the edge-on point (fold = 0.5) */
    const newSide = fold > 0.5 ? 'open' : 'closed';
    if (newSide !== coverSide) {
      coverSide = newSide;
      if (page2Offscreen) updateCoverCanvases();
    }

    apply();

    const settled =
      Math.abs(tY    - rotY)   < 0.015 && Math.abs(vY)    < 0.015 &&
      Math.abs(tX    - rotX)   < 0.015 && Math.abs(vX)    < 0.015 &&
      Math.abs(tEY   - entryY) < 0.015 && Math.abs(vEY)   < 0.015 &&
      Math.abs(tFold - fold)   < 0.001 && Math.abs(vFold) < 0.001;

    if (!settled) {
      raf = requestAnimationFrame(tick);
    } else {
      rotY = tY; rotX = tX; entryY = tEY; fold = tFold;
      vY = vX = vEY = vFold = 0;
      apply();
      raf = null;
    }
  }

  function startSpring() {
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /* ── Cover canvas swap ──────────────────────────────────────────── */
  function updateCoverCanvases() {
    if (!page2Offscreen) return;
    if (coverSide === 'closed') {
      /*
        Closed view: flaps fold over center.
        Left flap back face  → appears at screen x∈[25%,50%] → page2 [75–100%] (right lateral)
        Right flap back face → appears at screen x∈[50%,75%] → page2 [0–25%]   (left lateral)
        The flap fold mirrors left↔right, so laterals must be swapped relative
        to their page2 position to read correctly on screen.
        Center back face shows page2 [25–75%] on the back (fixed by extra Z). ✓
      */
      copySlice(page2Offscreen, cvCoverL, 0.75, 1.00);
      copySlice(page2Offscreen, cvCoverR, 0.00, 0.25);
    } else {
      /*
        Open + flipped view (gatefold rotated 180° to see exterior):
        Left flap back face  → appears at screen x∈[75%,100%] → page2 [75–100%]
        Right flap back face → appears at screen x∈[0%,25%]   → page2 [0–25%]
        Combined with center-back (always page2 [25–75%]) → full page2 visible.
      */
      copySlice(page2Offscreen, cvCoverL, 0.75, 1.00);
      copySlice(page2Offscreen, cvCoverR, 0.00, 0.25);
    }
  }

  /* ── Snap overall rotation ──────────────────────────────────────── */
  function snapGatefold() {
    if (isOpen) {
      /* Open: allow front (0°) and back (180°) */
      const norm  = ((rotY % 360) + 360) % 360;
      const front = norm < 90 || norm >= 270;
      const base  = Math.round(rotY / 360) * 360;
      let   snap  = front ? base : base + 180;
      while (snap - rotY >  180) snap -= 360;
      while (snap - rotY < -180) snap += 360;
      tY = snap;
    } else {
      /* Closed: always face front */
      tY = Math.round(rotY / 360) * 360;
    }
    tX = 0;
  }

  /* ── Drag / Click ──────────────────────────────────────────────── */
  /*
    Distinguish drag (rotate) from tap/click (open/close):
    if total pointer travel < CLICK_THRESHOLD px → treat as click → toggle fold.
  */
  const CLICK_THRESHOLD = 6;
  let downX = 0, downY = 0, totalTravel = 0;

  function onDown(x, y) {
    dragging    = true;
    lx = downX  = x;
    ly = downY  = y;
    totalTravel = 0;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vY = vX = 0;
  }

  function onMove(x, y) {
    if (!dragging) return;
    const dx = x - lx, dy = y - ly;
    totalTravel += Math.abs(dx) + Math.abs(dy);
    rotY += dx * 0.46;
    rotX  = Math.max(-13, Math.min(13, rotX - dy * 0.22));
    lx = x; ly = y;
    apply();
  }

  function toggleFold() {
    isOpen = !isOpen;
    tFold  = isOpen ? 1 : 0;
    tY     = Math.round(rotY / 360) * 360;
    tX     = 0;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vFold  = 0;
    startSpring();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;

    if (totalTravel < CLICK_THRESHOLD) {
      /* Tap / click → toggle open/close */
      toggleFold();
    } else {
      snapGatefold();
      startSpring();
    }

    if (!interacted) {
      interacted = true;
      hint.classList.remove('show');
    }
  }

  /* Mouse */
  gatefold.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove',   e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',     ()  => onUp());

  /* Touch */
  gatefold.addEventListener('touchstart', e => {
    e.preventDefault();
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  window.addEventListener('touchend', () => onUp());


  /* ── PDF rendering ───────────────────────────────────────────────── */
  /*
    PIXEL_SCALE: 2× (normal) or 3× (HiDPI) for crisp rendering.
    Strategy:
      1. Render each full PDF page to an offscreen canvas at PIXEL_SCALE.
      2. Use copySlice() to cut the appropriate horizontal slice into each
         panel's canvas. Panel canvases are sized to the slice width.
  */
  const PIXEL_SCALE = Math.min(window.devicePixelRatio >= 2 ? 3 : 2, 3);

  async function renderFullPage(pdf, pageNum) {
    const page = await pdf.getPage(pageNum);
    const vp0  = page.getViewport({ scale: 1 });

    const cssFullW = gatefold.offsetWidth || 740;
    const scale    = (cssFullW * PIXEL_SCALE) / vp0.width;
    const vp       = page.getViewport({ scale });

    const offscreen = document.createElement('canvas');
    offscreen.width  = Math.round(vp.width);
    offscreen.height = Math.round(vp.height);

    await page.render({ canvasContext: offscreen.getContext('2d'), viewport: vp }).promise;
    return offscreen;
  }

  /* Copy a horizontal fraction [x0..x1] of src into dst */
  function copySlice(src, dst, x0, x1) {
    const sh = src.height;
    const sx = Math.round(x0 * src.width);
    const sw = Math.round((x1 - x0) * src.width);

    /* Only reset dimensions when they actually change — assigning canvas.width
       always clears the canvas, even when the value is identical, which can
       cause a blank frame on some browsers (GPU texture invalidation). */
    if (dst.width !== sw || dst.height !== sh) {
      dst.width  = sw;
      dst.height = sh;
    }
    dst.getContext('2d').drawImage(src, sx, 0, sw, sh, 0, 0, sw, sh);
  }

  async function loadPDF() {
    try {
      const pdf = await pdfjsLib.getDocument('./voucher_azul.pdf').promise;

      const [page1, page2] = await Promise.all([
        renderFullPage(pdf, 1),   /* inner content */
        renderFullPage(pdf, 2),   /* exterior / cover */
      ]);

      /* Store page2 for dynamic cover swaps */
      page2Offscreen = page2;

      /* ── Front faces: page 1 in 25/50/25 slices ── */
      copySlice(page1, document.getElementById('canvas-inner-left'),   0,    0.25);
      copySlice(page1, document.getElementById('canvas-inner-center'), 0.25, 0.75);
      copySlice(page1, document.getElementById('canvas-inner-right'),  0.75, 1.0);

      /* ── Center back face: page 2 center 50% (static) ── */
      copySlice(page2, document.getElementById('canvas-center-back'),  0.25, 0.75);

      /* ── Flap back faces: initial = closed side ── */
      coverSide = 'closed';
      updateCoverCanvases();

      /* Mark all faces ready */
      ['face-inner-center','face-inner-left','face-inner-right',
       'face-center-back','face-cover-left','face-cover-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));

    } catch (err) {
      console.warn('[fbr-voucher] PDF load failed:', err);
      ['face-inner-center','face-inner-left','face-inner-right',
       'face-center-back','face-cover-left','face-cover-right']
        .forEach(id => document.getElementById(id).classList.add('ready'));
    }

    /* Reveal the gatefold only after canvases are filled — prevents flicker
       between the loading placeholder and the cover image.
       Double-rAF ensures the browser has painted at least one frame with
       the correct 3D transforms before the opacity transition begins. */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      gatefold.classList.add('loaded');
    }));
  }

  /* ── Init ────────────────────────────────────────────────────────── */
  function init() {
    fold  = 0;
    tFold = 0;

    apply();
    loadPDF(); /* reveals gatefold once canvases are ready */

    /* Entrance spring: (rotY=−22, entryY=26) → (0, 0) */
    startSpring();

    /* After entrance settles: show UI + subtle fold peek */
    setTimeout(() => {
      if (interacted) return;

      hint.classList.add('show');

      /* Slight peek then close — teases the click-to-open action */
      setTimeout(() => {
        if (interacted) return;
        tFold = 0.14;
        startSpring();
        setTimeout(() => {
          if (interacted) return;
          tFold = 0;
          startSpring();
        }, 700);
      }, 300);

    }, 1400);
  }

  init();
</script>
